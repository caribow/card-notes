<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>闪念笔记 · FlashNote</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/umap-js@1.3.3/lib/umap-js.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#333333; --green-light:#E4E4E4; --green-shadow:rgba(0,0,0,.12);
  --border:#E2E2E2; --border-soft:#EBEBEB;
  --bg:#FFFFFF; --bg-soft:#F4F4F4;
  --text:#3A3A3A; --text-2:#8A8A8A; --text-3:#B0B0B0;
  --tag-bg:#F2F2F2; --hover-bg:#ECECEC; --mask:rgba(0,0,0,.18);
  --red:#ef4444;
  --side-bg:#4A4A4A; --side-bg-deep:#3D3D3D; --side-border:#3F3F3F;
  --side-text:#D8D8D8; --side-text-2:#9A9A9A; --side-text-3:#777777;
  --side-hover:#545454; --side-active-bg:#5C5C5C;
  --mono:"JetBrains Mono","SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --side-w:248px; --topbar-h:48px;
}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;outline:none;border:none}

.app{display:flex;height:100vh;height:100dvh;width:100%;overflow:hidden}

/* ============ SIDEBAR ============ */
.sidebar{
  width:var(--side-w);flex-shrink:0;background:var(--side-bg);
  border-right:none;display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.4,0,.2,1),margin-left .28s cubic-bezier(.4,0,.2,1);z-index:100;
  box-shadow:2px 0 12px rgba(0,0,0,.08),inset -1px 0 0 rgba(255,255,255,.04);
}
.app.sidebar-collapsed .sidebar{margin-left:calc(-1 * var(--side-w))}

/* ---- Side profile (avatar) ---- */
.side-profile{padding:26px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;border-bottom:1px solid var(--side-border);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side-avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.15)}
.side-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.side-name{font-size:13px;color:var(--side-text);letter-spacing:1px;font-weight:500}
.side-search{margin:12px 16px 10px;position:relative;padding-bottom:12px;border-bottom:1px solid var(--side-border);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.side-search input{
  width:100%;height:32px;background:var(--side-bg-deep);border:1px solid transparent;border-radius:3px;
  padding:0 10px 0 30px;font-size:12.5px;color:var(--side-text);transition:border-color .2s;
}
.side-search input:focus{border-color:#666}
.side-search input::placeholder{color:var(--side-text-3)}
.side-search svg{position:absolute;left:9px;top:16px;transform:translateY(-50%);color:var(--side-text-3);pointer-events:none}

/* ---- Heatmap ---- */
.heatmap-section{padding:12px 16px 8px;border-bottom:1px solid var(--side-border);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.heatmap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.heatmap-title{font-family:var(--mono);font-size:10px;color:var(--side-text-3);letter-spacing:.5px;text-transform:uppercase}
.heatmap-count{font-family:var(--mono);font-size:11px;color:var(--side-text);font-weight:500}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.heatmap-cell{
  aspect-ratio:1;border-radius:2px;background:#3F3F3F;
  transition:transform .12s,background .15s,box-shadow .12s;
}
.heatmap-cell:hover{transform:scale(1.45);z-index:5;position:relative;background:#F2F2F2;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.heatmap-cell.heat-empty{background:transparent;pointer-events:none;padding:0;display:block;box-shadow:none}
.heatmap-cell.heat-empty:hover{background:transparent;transform:none}
.heatmap-cell.today{outline:1px solid #9A9A9A;outline-offset:1px}
.heatmap-cell.l1{background:#6E6E6E}
.heatmap-cell.l2{background:#969696}
.heatmap-cell.l3{background:#BEBEBE}
.heatmap-cell.l4{background:#E8E8E8}
.heatmap-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.heatmap-week span{font-family:var(--mono);font-size:8px;color:var(--side-text-3);text-align:center}
.heatmap-months{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:8px;color:var(--side-text-3)}

.tree{flex:1 1 auto;min-height:280px;overflow-y:auto;padding:6px 8px 16px;list-style:none}
.tree::-webkit-scrollbar{width:5px}
.tree::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
.side-map-entry{margin:2px 16px 8px;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--side-border);border-radius:3px;font-size:12.5px;color:var(--side-text-2);cursor:pointer;transition:border-color .15s,color .15s,background .15s;flex-shrink:0}
.side-map-entry:hover{border-color:#666;color:#EDEDED;background:var(--side-hover)}
.side-map-entry svg{flex-shrink:0}
/* 回收站钉在标签树下方，不随标签滑动 */
.side-trash-entry{margin:2px 16px 8px;border-top:1px solid var(--side-border);border-radius:0 0 3px 3px;padding-top:10px}
.tree-item{margin:1px 0}
.tree-row{
  display:flex;align-items:center;gap:6px;padding:6px 10px 6px 13px;border-radius:3px;
  cursor:pointer;font-size:13px;color:var(--side-text-2);transition:background .15s,color .15s;
  user-select:none;position:relative;
}
.tree-row:hover{background:var(--side-hover);color:var(--side-text)}
.tree-row.active{background:var(--side-active-bg);color:#FFFFFF;font-weight:500}
.tree-row.active::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:1px;background:#EDEDED}
.tree-row.active .tree-count{color:#EDEDED;opacity:.7}
.tree-toggle{font-family:var(--mono);font-size:9px;color:var(--side-text-3);width:12px;flex-shrink:0;transition:transform .2s;text-align:center}
.tree-item.open>.tree-row .tree-toggle{transform:rotate(90deg)}
.tree-leaf .tree-toggle{visibility:hidden}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tree-count{font-family:var(--mono);font-size:11px;color:var(--side-text-3);flex-shrink:0}
.tree-children{list-style:none;padding-left:16px;max-height:0;overflow:hidden;transition:max-height .3s ease}
.tree-item.open>.tree-children{max-height:600px}
.tree-children .tree-row{font-size:12.5px}

.side-foot{padding:8px 16px;border-top:1px solid var(--side-border);display:flex;align-items:center;justify-content:space-between;box-shadow:0 -1px 3px rgba(0,0,0,.06)}
.side-foot-left{display:flex;align-items:center;gap:6px}
.side-foot .ver{font-family:var(--mono);font-size:10px;color:var(--side-text-3)}
.theme-toggle{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--side-text-3);transition:background .15s,color .15s}
.theme-toggle:hover{background:var(--side-hover);color:var(--side-text)}

/* ============ MAIN ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 20px;z-index:10;
}
.menu-btn{display:flex;width:34px;height:34px;border-radius:4px;align-items:center;justify-content:center;color:var(--text-2)}
.menu-btn:hover{background:var(--hover-bg)}
.topbar-spacer{flex:1}
.topbar-tag{
  font-family:var(--mono);font-size:11px;color:var(--text-2);
  background:var(--tag-bg);padding:3px 8px 3px 10px;border-radius:2px;
  white-space:nowrap;flex-shrink:0;cursor:pointer;display:none;
  align-items:center;gap:5px;transition:opacity .15s;line-height:1.4;
}
.topbar-tag.show{display:inline-flex}
.topbar-tag:hover{opacity:.65}
.topbar-tag .x{font-size:14px;line-height:1;margin-top:-1px}
.topbar-expand{
  width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:color .15s,background .15s;flex-shrink:0;
}
.topbar-expand:hover{color:var(--text);background:var(--hover-bg)}

/* ---- Content ---- */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.feed{max-width:640px;margin:0 auto;padding:16px 20px 80px}

/* ---- Input card (first card in feed) ---- */
.input-card{
  border:1px dashed var(--border);border-radius:3px;background:var(--bg);
  margin-bottom:10px;transition:border-color .2s,box-shadow .2s;position:relative;
}
.input-card:focus-within{
  border-color:#999;border-style:solid;
  box-shadow:0 2px 10px var(--green-shadow);
}
.input-card-head{
  font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.5px;
  padding:10px 16px 0;display:flex;align-items:center;gap:6px;transition:color .2s;
}
.input-card-head .dot{width:5px;height:5px;border-radius:50%;background:#888;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
.input-card:focus-within .input-card-head{color:var(--text-2)}
.input-card textarea{
  width:100%;min-height:44px;resize:none;font-size:14.5px;line-height:1.7;color:var(--text);
  background:transparent;border:none;outline:none;padding:8px 16px 4px;font-family:var(--sans);
}
.input-card textarea::placeholder{color:var(--text-3)}
.input-card-foot{
  display:flex;align-items:center;gap:4px;padding:4px 8px 10px 16px;
  opacity:.4;transition:opacity .2s;
}
.input-card:focus-within .input-card-foot{opacity:1}
.input-card-tools{display:flex;gap:2px;flex:1}
.input-tool-btn{
  width:28px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:color .15s,background .15s;
}
.input-tool-btn:hover{color:var(--text);background:var(--hover-bg)}
.input-tool-btn.active{color:var(--text)}
.input-send{
  font-size:12px;color:var(--text-3);padding:5px 14px;border-radius:3px;
  transition:color .15s,background .15s,opacity .15s;flex-shrink:0;
}
.input-send:hover{color:var(--text);background:var(--hover-bg)}
.input-send.active{background:#4A4A4A;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.input-send.active:hover{opacity:.9}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---- Date separator ---- */
.date-sep{
  font-family:var(--mono);font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:1px;
  text-transform:uppercase;padding:12px 0 8px 12px;display:flex;align-items:center;gap:8px;position:relative;
}
.date-sep::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:1px;background:#4A4A4A}
.date-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.date-sep.today{color:#1A1A1A}

/* ---- Note card ---- */
.card{
  border:1px solid var(--border);border-radius:3px;padding:14px 16px 0;
  margin-bottom:14px;background:var(--bg);transition:border-color .2s,box-shadow .2s;
  position:relative;cursor:pointer;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.03);
}
.card:hover{border-color:#999;box-shadow:0 2px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06)}
.card.pinned{border-color:#666}
.card.pinned .card-ts .dot{animation:pulse 2s ease-in-out infinite}
.card-ts{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card-ts .dot{width:5px;height:5px;border-radius:50%;background:#888;flex-shrink:0}
.card-txt{font-size:14.5px;line-height:1.75;color:var(--text);letter-spacing:.1px;word-break:break-word;font-family:var(--sans)}
.card-txt.collapsed{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-menu-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:0;transition:opacity .15s,background .15s,color .15s;z-index:2;background:var(--bg)}
.card:hover .card-menu-btn{opacity:1}
.card-menu-btn:hover{background:var(--hover-bg);color:var(--text)}

.card-txt strong{font-weight:600}
.card-txt em{font-style:italic;color:var(--text-2)}
.card-txt code{font-family:var(--mono);font-size:12.5px;background:var(--tag-bg);padding:1px 5px;border-radius:2px;color:#555}
.card-txt .bilink{color:#333;background:var(--tag-bg);padding:0 4px;border-radius:2px;cursor:pointer;text-decoration:none;font-weight:500;border-bottom:1.5px solid #999}
.card-txt .bilink:hover{background:#4A4A4A;color:#fff;border-bottom-color:#4A4A4A}
.card-txt .bilink.broken{color:var(--text-3);background:var(--tag-bg);border-bottom:1px dashed var(--text-3);cursor:default}
.card-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.card-tag{font-family:var(--mono);font-size:11px;color:var(--text-2);padding:2px 7px;border-radius:2px;background:var(--tag-bg);transition:color .15s,background .15s;cursor:pointer;position:relative;z-index:1}
.card-tag:hover{color:#fff;background:#4A4A4A}
.card-tag.match{color:#fff;background:#4A4A4A;font-weight:500}

/* ---- Card meta strip ---- */
.card-meta{display:flex;align-items:center;gap:10px;margin:12px -16px 0;padding:8px 16px;border-top:1px solid var(--border-soft);background:var(--bg-soft);font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.5px;box-shadow:0 -1px 2px rgba(0,0,0,.02),inset 0 1px 0 rgba(0,0,0,.02)}
.card-meta .card-meta-ind{display:inline-flex;align-items:center;gap:4px}
.card-meta svg{opacity:.55;flex-shrink:0}

/* ---- 置顶区（每页钉顶，独立视觉区） ---- */
.pin-zone{background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:6px;padding:10px 10px 4px;margin-bottom:16px}
.pin-zone-head{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;padding:0 4px 8px}
.pin-zone .card{margin-bottom:10px;background:var(--bg)}
.pin-zone .card.pinned{border-color:#666}

/* ---- 分页工具条 ---- */
.page-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0 8px;flex-wrap:wrap}
.page-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text);padding:8px 16px;border-radius:10px;background:#4A4A4A;color:#fff;transition:opacity .15s,transform .1s;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.page-btn:hover:not(:disabled){opacity:.92}
.page-btn:active:not(:disabled){transform:scale(.97)}
.page-btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.page-num{font-family:var(--mono);font-size:12px;color:var(--text-2);letter-spacing:1px;padding:0 4px}
.page-top{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s,border-color .15s}
.page-top:hover{background:var(--hover-bg);color:var(--text);border-color:#999}
@media(max-width:768px){
  .page-bar{gap:8px;padding:14px 0 4px}
  .page-btn{padding:9px 14px;font-size:12.5px}
}

/* ---- Card menu popup ---- */
.card-menu-pop{position:fixed;z-index:650;background:var(--bg);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:4px;min-width:130px;display:none}
.card-menu-pop.show{display:block}
.card-menu-item{padding:8px 14px;font-size:13px;color:var(--text);border-radius:6px;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:7px}
.card-menu-item[hidden]{display:none !important}
.card-menu-item:hover{background:var(--hover-bg)}
.card-menu-item.danger{color:var(--red)}
.card-menu-item.danger:hover{background:rgba(239,68,68,.08)}
.card-menu-item svg{flex-shrink:0;opacity:.7}

/* ---- Modal (fullscreen editor) ---- */
.modal-mask{position:fixed;inset:0;background:var(--mask);z-index:200;display:flex;align-items:stretch;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:760px;background:var(--bg);display:flex;flex-direction:column;padding:16px 24px;transform:translateY(20px);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modal-mask.show .modal{transform:translateY(0)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title{font-size:14px;color:var(--text);font-weight:600}
.modal-head-right{display:flex;align-items:center;gap:4px}
.modal-close{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:18px}
.modal-close:hover{background:var(--hover-bg);color:var(--text)}
.modal .modal-compose{flex:1;min-height:0}
.modal .modal-textarea{width:100%;min-height:0;flex:1;resize:none;font-size:14.5px;line-height:1.8;color:var(--text);background:transparent;border:0;padding:18px 16px 10px}
.modal-compose-thumbs{margin:0;padding:0 16px 10px}
.modal-compose-thumbs:empty{display:none}
.img-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.img-thumb{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.img-thumb-del:hover{background:rgba(0,0,0,.75)}
.btn-cancel{font-size:13px;color:var(--text-2);padding:7px 16px;border-radius:7px;transition:background .15s}
.btn-cancel:hover{background:var(--hover-bg)}

/* ---- Empty ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-3)}
.empty svg{margin-bottom:14px;opacity:.4}
.empty p{font-family:var(--mono);font-size:12px;letter-spacing:.5px}

/* ---- Overlay ---- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;opacity:0;transition:opacity .25s}
.overlay.show{display:block;opacity:1}

/* ---- Mention dropdown ---- */
.mention-dropdown{position:fixed;z-index:500;max-height:240px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:4px;display:none}
.mention-dropdown.show{display:block}
.mention-dropdown::-webkit-scrollbar{width:5px}
.mention-dropdown::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mention-item{padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .12s}
.mention-item:hover,.mention-item.active{background:var(--hover-bg)}
.mention-item-title{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px}
.mention-item-title .at{color:#888;font-family:var(--mono)}
.mention-item-preview{font-size:11px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Lightbox ---- */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:750;display:none;align-items:center;justify-content:center;padding:30px}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:6px}
.lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;opacity:.7;line-height:1}
.lightbox-close:hover{opacity:1}

/* ---- Detail view ---- */
.detail-mask{position:fixed;inset:0;z-index:250;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.detail-mask.show{transform:translateX(0)}
.detail-view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.detail-topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border-soft);position:relative}
.detail-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:7px;transition:background .15s,color .15s;flex-shrink:0}
.detail-back:hover{background:var(--hover-bg);color:var(--text)}
.detail-crumb{flex:1;font-family:var(--mono);font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-mask.editing .detail-crumb{display:none}
.detail-mask.editing .detail-menu-btn{display:none}
.detail-mask.editing .detail-edit-save{display:none}
.detail-edit-save{display:none;flex-shrink:0}
.detail-menu-btn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s;flex-shrink:0}
.detail-menu-btn:hover{background:var(--hover-bg);color:var(--text)}
.detail-menu-anchor{position:relative;flex-shrink:0}
.detail-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.detail-content::-webkit-scrollbar{width:6px}
.detail-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.detail-inner{max-width:680px;margin:0 auto;padding:24px 24px 80px}
.detail-ts{font-family:var(--mono);font-size:12px;color:var(--text-3);letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.detail-ts .dot{width:6px;height:6px;border-radius:50%;background:#888}
.detail-txt{font-size:15.5px;line-height:1.9;color:var(--text);letter-spacing:.1px;word-break:break-word;min-height:40px;font-family:var(--sans)}
.detail-txt strong{font-weight:600}
.detail-txt em{font-style:italic;color:var(--text-2)}
.detail-txt code{font-family:var(--mono);font-size:13px;background:var(--tag-bg);padding:1px 6px;border-radius:2px;color:#555}
.detail-txt blockquote{border-left:3px solid #999;padding:8px 14px;margin:10px 0;color:var(--text-2);font-size:14.5px;background:var(--tag-bg);border-radius:0 3px 3px 0}
.detail-txt h1{font-size:18px;font-weight:600;margin:14px 0 6px}
.detail-txt h2{font-size:16px;font-weight:600;margin:12px 0 4px}
.detail-txt h3{font-size:15px;font-weight:600;margin:10px 0 4px}
.detail-txt ul,.detail-txt ol{padding-left:20px;margin:6px 0}
.detail-txt li{margin:3px 0}
.detail-txt a{color:#333;text-decoration:none;border-bottom:1px solid #999}
.detail-txt a:hover{text-decoration:none;border-bottom-color:#333}
.detail-txt .bilink{color:#333;background:var(--tag-bg);padding:1px 5px;border-radius:2px;cursor:pointer;text-decoration:none;font-weight:500;border-bottom:1.5px solid #999}
.detail-txt .bilink:hover{background:#4A4A4A;color:#fff;border-bottom-color:#4A4A4A}
.detail-txt .bilink.broken{color:var(--text-3);background:var(--tag-bg);border-bottom:1px dashed var(--text-3);cursor:default}
.detail-editor{padding:18px 20px 24px}
.detail-compose{min-height:clamp(420px,72vh,680px);display:flex;flex-direction:column;border:1px solid #999;border-radius:3px;background:var(--bg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.detail-compose:focus-within{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.detail-edit-area{width:100%;min-height:0;flex:1;font-size:15.5px;line-height:1.9;color:var(--text);background:transparent;border:none;outline:none;resize:none;padding:20px 18px 12px;font-family:var(--sans)}
.detail-edit-area::placeholder{color:var(--text-3)}
.detail-compose-thumbs{margin:0;padding:0 18px 10px}
.detail-compose-thumbs:empty{display:none}
.detail-editor-options{border-top:1px solid var(--border-soft);background:var(--bg-soft)}
.detail-editor-options[hidden],.detail-editor-option[hidden]{display:none}
.detail-editor-option{min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 14px}
.detail-option-prefix{width:20px;flex-shrink:0;color:var(--text-3);font-family:var(--mono);font-size:15px;text-align:center}
.detail-option-input{min-width:0;flex:1;height:30px;background:transparent;color:var(--text);font-family:var(--mono);font-size:12.5px}
.detail-option-input::placeholder{color:var(--text-2);opacity:.8}
.detail-compose-toolbar{min-height:48px;display:flex;align-items:center;gap:2px;padding:7px 10px;border-top:1px solid var(--border-soft);color:var(--text-3)}
.detail-compose-tool{position:relative;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;color:var(--text-2);font-size:15px;font-family:var(--mono);transition:color .15s,background .15s}
.detail-compose-tool:hover,.detail-compose-tool.active{color:var(--text);background:var(--hover-bg)}
.detail-compose-tool svg{width:17px;height:17px}
.detail-tool-divider{width:1px;height:16px;margin:0 5px;background:var(--border)}
.detail-attachment-count{display:none;position:absolute;top:0;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#4A4A4A;color:#fff;font-size:9px;line-height:14px;text-align:center;font-family:var(--mono)}
.detail-attachment-count.show{display:block}
.detail-toolbar-spacer{flex:1}
.detail-submit{min-width:44px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;background:#4A4A4A;color:#fff;font-size:12px;font-weight:500;padding:0 12px;transition:opacity .15s,transform .15s}
.detail-submit:hover{opacity:.88;transform:translateY(-1px)}
.detail-submit:disabled{opacity:.4;cursor:default;transform:none}
.detail-submit svg{width:17px;height:17px}
.detail-imgs{margin-top:20px}
.detail-imgs-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.detail-imgs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-imgs-grid img{width:100%;border-radius:3px;cursor:pointer;transition:opacity .15s}
.detail-imgs-grid img:hover{opacity:.85}
.detail-imgs-grid.single img{grid-column:span 2;max-height:400px;object-fit:cover}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.detail-tag{font-family:var(--mono);font-size:12px;color:var(--text-2);padding:3px 9px;border-radius:2px;background:var(--tag-bg);cursor:pointer;transition:color .15s,background .15s}
.detail-tag:hover{color:#fff;background:#4A4A4A}
.detail-links{margin-top:28px}
.detail-links-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.detail-links-title .arrow{color:#888}
.link-card{border:1px solid var(--border);border-radius:3px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.link-card:hover{border-color:#999;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.link-card-ts{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-bottom:5px}
.link-card-txt{font-size:13.5px;line-height:1.65;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--sans)}
.link-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.link-card-tag{font-family:var(--mono);font-size:10px;color:var(--text-2);padding:1px 5px;border-radius:2px;background:var(--tag-bg)}

/* ---- Confirm / Toast ---- */
.confirm-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:700;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.confirm-mask.show{display:flex}
.confirm-box{background:var(--bg);border-radius:12px;padding:24px;max-width:320px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.confirm-msg{font-size:14px;color:var(--text);margin-bottom:18px;line-height:1.6}
.confirm-foot{display:flex;gap:8px;justify-content:flex-end}
.btn-danger{background:var(--red);color:#fff;font-size:13px;padding:7px 18px;border-radius:7px;transition:opacity .15s}
.btn-danger:hover{opacity:.85}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:13px;padding:10px 20px;border-radius:8px;z-index:800;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Animations ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .35s ease both}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}

/* ============ LOGIN ============ */
.login-mask{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.login-mask.show{opacity:1;pointer-events:auto}
/* Safari 会对 DOM 中存在的密码字段触发自动填充弹窗，即使元素不可见；已登录时彻底移除布局与渲染 */
.app.authed ~ .login-mask,.login-mask.hidden-auth{display:none !important}
.login-box{width:90%;max-width:340px;text-align:center}
.login-logo{font-family:var(--mono);font-size:13px;color:var(--text-3);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.login-logo .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4A4A4A;margin-right:6px;vertical-align:middle}
.login-title{font-size:18px;color:var(--text);font-weight:600;margin-bottom:24px}
.login-input{
  width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:3px;
  padding:12px 14px;font-size:14px;color:var(--text);margin-bottom:12px;transition:border-color .2s;
}
.login-input:focus{border-color:#999;background:var(--bg)}
.login-input::placeholder{color:var(--text-3)}
.login-btn{
  width:100%;background:#4A4A4A;color:#fff;font-size:14px;padding:12px;border-radius:3px;
  transition:opacity .15s,transform .15s;box-shadow:0 2px 12px rgba(0,0,0,.15);font-weight:500;
}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-btn:disabled{opacity:.5;cursor:default;transform:none}
.login-err{font-size:12.5px;color:var(--red);margin-top:10px;min-height:18px;display:none}
.login-err.show{display:block}

/* ---- App hidden until authed ---- */
.app{display:none}
.app.authed{display:flex}

/* ============ RESPONSIVE ============ */
@media(max-width:768px){
  :root{--side-w:min(86vw,300px);--topbar-h:46px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:2px 0 20px rgba(0,0,0,.08)}
  .sidebar.show{transform:translateX(0)}
  .app.sidebar-collapsed .sidebar{margin-left:0}
  .feed{padding:12px 14px 80px}
  .card{padding:12px 14px 0;word-break:break-word;overflow-wrap:anywhere}
  .detail-compose{border:none;border-radius:0}
  .modal-mask{align-items:stretch;backdrop-filter:none;background:var(--bg)}
  .modal{max-width:none;padding:0;transform:none}
  .modal-head{padding:12px 16px 0;margin-bottom:10px}
  .modal .modal-textarea{font-size:16px}
  .detail-edit-area{font-size:16px}
  .card-txt{font-size:14px}
  .topbar{padding:0 10px;gap:6px}
  .menu-btn{width:40px;height:40px}
  .card-menu-btn{width:36px;height:36px;top:3px;right:3px;opacity:.45}
  .detail-menu-btn{width:40px;height:40px}
  .topbar-tag{max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .detail-inner{padding:20px 18px 80px}
  .detail-editor{padding:12px 10px 16px}
  .detail-compose{min-height:calc(100dvh - 90px)}
  .detail-edit-area{padding:16px 14px 10px}
  .detail-compose-thumbs{padding:0 14px 8px}
  .detail-compose-toolbar{padding:7px 8px}
  .detail-compose-tool{width:29px}
  .detail-tool-divider{margin:0 2px}
  .format-panel .md-btn{min-width:30px;height:28px}
  .heatmap-grid{grid-template-columns:repeat(7,1fr)}
  .heatmap-week{grid-template-columns:repeat(7,1fr)}
}
@media(min-width:769px){
  /* Desktop: sidebar and feed are one centered, top-aligned document flow. */
  body{overflow-y:auto}
  .app.authed{display:grid;grid-template-columns:248px minmax(0,640px);column-gap:28px;align-items:start;width:calc(100% - 40px);max-width:916px;margin:0 auto;padding:32px 0 80px;height:auto;min-height:100vh;overflow:visible}
  .menu-btn{display:none}
  .sidebar{position:relative;top:auto;height:auto;max-height:calc(100vh - 32px);margin:0;transform:none !important;border-radius:2px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.14),0 12px 32px rgba(0,0,0,.12)}
  .app.sidebar-collapsed .sidebar{margin-left:0}
  .overlay{display:none !important}
  .main{width:100%;min-height:100vh}
  .topbar{height:0;min-height:0;padding:0;overflow:visible;position:relative}
  .topbar-tag{position:absolute;right:8px;top:8px;z-index:3}
  .content{overflow:visible}
  .feed{padding:0 0 80px}
  .detail-inner{padding:28px 24px 80px}
  /* Detail topbar: buttons closer to content */
  .detail-topbar{padding:0 calc(50% - 340px)}
}
@media(min-width:1025px){.detail-inner{padding:28px 24px 80px}}

/* ============ COGNITIVE MAP ============ */
.map-mask{position:fixed;inset:0;z-index:240;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.map-mask.show{transform:translateX(0)}
.map-topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border-soft)}
.map-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:7px;transition:background .15s,color .15s}
.map-back:hover{background:var(--hover-bg);color:var(--text)}
.map-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:2px;flex:1}
.map-count{font-family:var(--mono);font-size:10px;color:#666;white-space:nowrap}
.map-controls{display:flex;align-items:center;gap:3px}
.map-zoom-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:3px;color:var(--text-2);background:var(--bg);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center}
.map-zoom-btn:hover{border-color:#999;color:var(--text);background:var(--hover-bg)}
.map-zoom-reset{font-size:10px;width:auto;padding:0 8px}
.map-body{flex:1;overflow:hidden;position:relative;-webkit-overflow-scrolling:touch;touch-action:none}
.map-canvas{position:absolute;inset:0}
.map-canvas svg{display:block;width:100%;height:100%;cursor:grab}
.map-canvas svg:active{cursor:grabbing}
.map-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:12px;padding:30px;text-align:center}
.map-empty p{font-family:var(--mono);font-size:12px;letter-spacing:.5px}
.map-hint{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.2px;background:var(--bg);padding:4px 9px;border-radius:5px;border:1px solid var(--border-soft);opacity:.9;pointer-events:none}
.map-node{cursor:pointer}
.map-node circle{transition:r .12s,opacity .12s}
.map-node:hover circle{r:6}
.map-node.unfenced circle{fill:var(--text-3);opacity:.32}
.map-theme-fence{stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map-theme-label{cursor:pointer}
.map-theme-label text{pointer-events:none;text-anchor:middle}
.map-theme-label:hover .map-peak-label{fill:#000}
.map-peak-label{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--text);text-anchor:middle}
.map-peak-count{font-family:var(--mono);font-size:9px;fill:var(--text-3);text-anchor:middle}
.map-theme-panel{position:absolute;right:14px;top:14px;width:min(320px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.14);padding:16px;z-index:4;display:none}
.map-theme-panel.show{display:block}
.map-theme-panel-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.map-theme-panel-title{flex:1;font-size:16px;font-weight:600;line-height:1.35;color:var(--text)}
.map-theme-panel-close{width:24px;height:24px;border-radius:5px;color:var(--text-3);font-size:18px;line-height:1}
.map-theme-panel-close:hover{background:var(--hover-bg);color:var(--text)}
.map-theme-panel-meta{font-family:var(--mono);font-size:10px;color:#666;margin-bottom:10px}
.map-theme-panel-note{width:100%;text-align:left;padding:8px 10px;border-radius:3px;background:var(--bg-soft);border:1px solid var(--border-soft);margin-top:6px;color:var(--text-2);font-size:12px;line-height:1.5}
.map-theme-panel-note:hover{border-color:#999;color:var(--text)}
.map-theme-panel-kicker{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-3);margin-top:12px}
@media(max-width:768px){
  .map-topbar{padding:0 10px;gap:4px}.map-title{display:none}.map-count{max-width:112px;overflow:hidden;text-overflow:ellipsis}
  .map-theme-panel{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:44%;border-radius:12px}
  .map-hint{right:12px;text-align:center}
}

/* ============ INSIGHT PAGE ============ */
.insight-mask{position:fixed;inset:0;z-index:242;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.insight-mask.show{transform:translateX(0)}
.insight-topbar{height:var(--topbar-h);flex-shrink:0;padding:0;border-bottom:1px solid var(--border-soft)}
.insight-topbar-inner{width:100%;max-width:640px;height:100%;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:8px}
.insight-back{flex-shrink:0;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:7px;transition:background .15s,color .15s}
.insight-back:hover{background:var(--hover-bg);color:var(--text)}
.insight-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insight-count{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.insight-select-all{flex-shrink:0;font-size:12px;color:var(--text-2);padding:6px 8px;border-radius:6px}
.insight-select-all:hover{color:var(--text);background:var(--hover-bg)}
.insight-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.insight-inner{max-width:640px;margin:0 auto;padding:20px 20px 80px}
.insight-source{margin-bottom:6px}
.insight-source .card{cursor:default}
/* 「源笔记/关联笔记」标识与首页日期分隔线同款：竖杠+文字+横线 */
.insight-source-kicker,.insight-list-kicker{position:relative;display:flex;align-items:center;gap:8px;padding:12px 0 8px 12px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--text-2)}
.insight-source-kicker::before,.insight-list-kicker::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:1px;background:#4A4A4A}
.insight-source-kicker::after,.insight-list-kicker::after{content:"";flex:1;height:1px;background:var(--border)}
.insight-rel{position:relative}
.insight-rank{position:absolute;left:-6px;top:-6px;z-index:3;font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;background:#4A4A4A;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.insight-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-3);gap:10px;text-align:center}
.insight-empty p{font-family:var(--mono);font-size:12px;letter-spacing:.5px}
/* 批量选择：左侧选择列 */
.insight-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:start;margin-bottom:2px}
.insight-card-wrap{position:relative;min-width:0}
.insight-check{width:24px;height:24px;margin-top:12px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent;background:var(--bg);transition:background .15s,border-color .15s,color .15s;cursor:pointer}
.insight-check.on{color:#fff;background:#4A4A4A;border-color:#4A4A4A}
/* 批量操作条 */
.insight-actionbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,80px);z-index:646;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px 8px;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.insight-actionbar.show{transform:translate(-50%,0)}
.insight-actionbar .sel-count{font-family:var(--mono);font-size:11px;color:var(--text-2);padding:0 8px}
.insight-act{font-size:13px;padding:7px 14px;border-radius:16px;transition:background .15s;color:var(--text)}
.insight-act:hover{background:var(--hover-bg)}
.insight-act.primary{background:#4A4A4A;color:#fff}
.insight-act.primary:hover{opacity:.92}
@media(max-width:768px){
  .insight-topbar-inner{padding:0 14px}
  .insight-inner{padding:16px 14px 96px}
}

/* ============ BATCH TAG DIALOG ============ */
.batch-tag-mask{position:fixed;inset:0;z-index:680;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:20px}
.batch-tag-mask.show{display:flex}
.batch-tag-dialog{width:100%;max-width:400px;background:var(--bg);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:22px 22px 18px}
.batch-tag-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.batch-tag-desc{font-size:12.5px;color:var(--text-2);margin-bottom:16px;line-height:1.5}
.batch-tag-input-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;transition:border-color .15s}
.batch-tag-input-wrap:focus-within{border-color:#999}
.batch-tag-input-wrap span{font-family:var(--mono);color:var(--text-3);font-size:14px}
.batch-tag-input-wrap input{flex:1;min-width:0;font-size:14px;color:var(--text);background:transparent}
.batch-tag-input-wrap input::placeholder{color:var(--text-3)}
.batch-tag-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.batch-tag-submit{font-size:13px;color:#fff;background:#4A4A4A;padding:8px 20px;border-radius:9px;transition:opacity .15s;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.batch-tag-submit:hover{opacity:.92}
.batch-tag-submit:disabled{opacity:.4}
/* 标签建议下拉要高于对话框 */
#tagSuggestDropdown{z-index:690}
@media(max-width:768px){
  .batch-tag-dialog{padding:18px 18px 16px}
}

/* ============ TRASH PAGE ============ */
.trash-mask{position:fixed;inset:0;z-index:241;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.trash-mask.show{transform:translateX(0)}
.trash-topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border-soft)}
.trash-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:7px;transition:background .15s,color .15s}
.trash-back:hover{background:var(--hover-bg);color:var(--text)}
.trash-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:2px;flex:1}
.trash-count{font-family:var(--mono);font-size:11px;color:var(--text-2)}
.trash-clear{font-size:12px;color:var(--red);padding:6px 10px;border-radius:7px;transition:background .15s}
.trash-clear:hover{background:rgba(239,68,68,.08)}
.trash-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.trash-inner{max-width:640px;margin:0 auto;padding:16px 20px 100px}
.trash-card-wrap{display:flex;align-items:flex-start;gap:4px}
.trash-card-wrap .card{flex:1;min-width:0}
.trash-check{width:30px;height:30px;flex-shrink:0;margin-top:10px;border:1px solid var(--border);border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s;cursor:pointer}
.trash-check.on{background:#4A4A4A;border-color:#4A4A4A;color:#fff}
.trash-actionbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,80px);z-index:243;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px 8px;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.trash-actionbar.show{transform:translate(-50%,0)}
.trash-actionbar .sel-count{font-family:var(--mono);font-size:11px;color:var(--text-2);padding:0 8px}
.trash-act{font-size:13px;padding:7px 14px;border-radius:16px;transition:background .15s}
.trash-act.restore{color:var(--text)}
.trash-act.restore:hover{background:var(--hover-bg)}
.trash-act.danger{color:var(--red)}
.trash-act.danger:hover{background:rgba(239,68,68,.08)}
@media(max-width:768px){
  .trash-topbar{padding:0 10px}
  .trash-inner{padding:12px 12px 110px}
}

/* ============ WANDER（随机漫步） ============ */
.wander-mask{position:fixed;inset:0;z-index:244;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.wander-mask.show{transform:translateX(0)}
.wander-topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border-soft)}
.wander-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:7px;transition:background .15s,color .15s}
.wander-back:hover{background:var(--hover-bg);color:var(--text)}
.wander-title{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:2px;flex:1}
.wander-count{font-family:var(--mono);font-size:11px;color:var(--text-2)}
.wander-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden;padding:24px 20px 0}
.wander-deck{position:relative;width:min(560px,100%);height:min(62vh,560px);perspective:1200px}
.wander-card{
  position:absolute;inset:0;background:var(--bg);border:1px solid var(--border);border-radius:20px;
  box-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  padding:26px 26px 20px;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.wander-card.ghost1{transform:translateY(12px) scale(.965);opacity:.55;pointer-events:none}
.wander-card.ghost2{transform:translateY(24px) scale(.93);opacity:.28;pointer-events:none}
.wander-card.fly-out{transform:translate(-46%,-14%) rotate(-9deg);opacity:0}
.wander-card.fly-in{transform:translateY(60px) scale(.96);opacity:0}
.wander-card-date{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.wander-card-date .dot{width:5px;height:5px;border-radius:50%;background:#888;flex-shrink:0}
.wander-card-text{flex:1;overflow-y:auto;font-size:16px;line-height:1.85;color:var(--text);word-break:break-word;-webkit-overflow-scrolling:touch}
.wander-card-text img{max-width:100%;border-radius:8px;margin-top:8px}
.wander-card-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft)}
.wander-card-tag{font-family:var(--mono);font-size:11px;color:var(--text-2);padding:2px 7px;border-radius:2px;background:var(--tag-bg);cursor:default}
.wander-card-foot{flex-shrink:0;display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft)}
.wander-card-foot .wander-card-tags{flex:1;min-width:0;margin:0;padding:0;border:0}
.wander-expand{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--text-2);padding:5px 9px;border-radius:3px;background:var(--tag-bg);transition:background .15s,color .15s}
.wander-expand:hover{color:#fff;background:#4A4A4A}
.wander-card-menu{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:var(--bg);transition:background .15s,color .15s;z-index:2}
.wander-card-menu:hover{background:var(--hover-bg);color:var(--text)}
.wander-foot{flex-shrink:0;width:min(560px,100%);padding:20px 0 calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.wander-next{
  width:100%;padding:15px 0;border-radius:14px;background:#4A4A4A;color:#fff;font-size:15px;font-weight:500;
  letter-spacing:1px;transition:opacity .15s,transform .1s;box-shadow:0 6px 20px rgba(0,0,0,.18);
}
.wander-next:hover{opacity:.92}
.wander-next:active{transform:scale(.98)}
.wander-next:disabled{opacity:.4;transform:none}
.wander-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);text-align:center;padding:40px}
.wander-empty p{font-family:var(--mono);font-size:12px;letter-spacing:.5px}
@media(max-width:768px){
  .wander-topbar{padding:0 10px}
  .wander-body{padding:16px 14px 0}
  .wander-deck{height:min(58vh,520px)}
  .wander-card{padding:20px 18px 16px;border-radius:18px}
}
</style>
</head>
<body>
<!-- ===== LOGIN ===== -->
<div class="login-mask" id="loginMask">
  <div class="login-box">
    <div class="login-logo"><span class="dot"></span>FLASHNOTE</div>
    <div class="login-title">登录</div>
    <input type="email" class="login-input" id="loginEmail" placeholder="邮箱" autocomplete="email">
    <input type="password" class="login-input" id="loginPass" placeholder="密码" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-profile">
      <div class="side-avatar"><img id="sideAvatarImg" alt="trinsdau"></div>
      <div class="side-name">trinsdau</div>
    </div>
    <div class="heatmap-section" id="heatmapSection">
      <div class="heatmap-head">
        <span class="heatmap-title">活跃度</span>
        <span class="heatmap-count" id="heatmapCount">0 篇</span>
      </div>
      <div class="heatmap-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
      <div class="heatmap-months" id="heatmapMonths"></div>
    </div>
    <div class="side-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="搜索笔记..." id="searchInput">
    </div>
    <div class="side-map-entry" id="mapEntry" title="认知地图">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m-6 3l6-3"/></svg>
      <span>认知地图</span>
    </div>
    <div class="side-map-entry" id="wanderEntry" title="随机漫步">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v13"/></svg>
      <span>随机漫步</span>
    </div>
    <ul class="tree" id="tree"></ul>
    <div class="side-map-entry side-trash-entry" id="trashEntry" title="回收站">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>回收站</span>
    </div>
    <div class="side-foot">
      <div class="side-foot-left">
        <button class="theme-toggle" id="logoutBtn" aria-label="退出登录" title="退出登录">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="topbar-tag" id="topbarTag"></span>
      <div class="topbar-spacer"></div>
    </div>
    <div class="content" id="content">
      <div class="feed" id="feed"></div>
    </div>
  </main>
</div>

<!-- ===== MENTION DROPDOWN ===== -->
<div class="mention-dropdown" id="mentionDropdown"></div>

<!-- ===== TAG SUGGEST DROPDOWN ===== -->
<div class="mention-dropdown" id="tagSuggestDropdown"></div>

<!-- ===== NOTE MENU（全局唯一共享菜单：首页 / 详情 / 洞察 / 随机漫步 均使用本弹层） ===== -->
<div class="card-menu-pop" id="noteMenuPop">
  <div class="card-menu-item" data-action="pin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg><span class="pin-label">置顶</span></div>
  <div class="card-menu-item" data-action="edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</div>
  <div class="card-menu-item" data-action="reference-create"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>引用</div>
  <div class="card-menu-item" data-action="insight"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="3.5"/></svg>洞察</div>
  <div class="card-menu-item danger" data-action="delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="delete-label">删除</span></div>
  <div class="card-menu-item" data-action="restore" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>恢复</div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title">新建笔记</div>
      <div class="modal-head-right">
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
    </div>
    <div class="detail-compose modal-compose">
      <textarea class="modal-textarea" id="noteText" placeholder="记录一个想法..."></textarea>
      <input type="file" id="imgFileInput" accept="image/*" multiple style="display:none">
      <div class="img-thumbs modal-compose-thumbs" id="imgThumbs"></div>
      <div class="detail-editor-options" id="modalEditorOptions" hidden>
        <label class="detail-editor-option" id="modalTagPanel" hidden><span class="detail-option-prefix">#</span><input type="text" class="detail-option-input" id="noteTags" placeholder="空格分隔标签，/ 表示层级"></label>
        <label class="detail-editor-option" id="modalDatePanel" hidden><span class="detail-option-prefix">◷</span><input type="date" class="detail-option-input" id="noteRecordedOn" title="留空则使用创建日期"></label>
      </div>
      <div class="detail-compose-toolbar">
        <button class="detail-compose-tool" id="modalTagTool" title="标签" aria-label="标签"><span class="detail-hash-icon">#</span></button>
        <button class="detail-compose-tool" id="imgAddBtn" title="添加图片" aria-label="添加图片"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 4"/></svg><span class="detail-attachment-count" id="modalAttachmentCount"></span></button>
        <button class="detail-compose-tool" id="modalDateTool" title="记录日期" aria-label="记录日期"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button>
        <span class="detail-tool-divider"></span>
        <button class="detail-compose-tool detail-aa-tool" data-md="bold" title="粗体" aria-label="粗体">Aa</button>

        <button class="detail-compose-tool detail-numbered-tool" data-md="numbered" title="有序列表" aria-label="有序列表">1.</button>
        <span class="detail-tool-divider"></span>
        <button class="detail-compose-tool detail-at-tool" data-md="bilink" title="关联笔记" aria-label="关联笔记">@</button>
        <span class="detail-toolbar-spacer"></span>
        <button class="detail-submit" id="btnSave" title="保存" aria-label="保存">保存</button>

</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox"><span class="lightbox-close" id="lightboxClose">&times;</span><img id="lightboxImg" src="" alt=""></div>

    <div class="detail-topbar">

      <div class="detail-crumb" id="detailCrumb"></div>

      </div>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<!-- ===== COGNITIVE MAP ===== -->
<div class="map-mask" id="mapMask">
  <div class="map-topbar">
    <button class="map-back" id="mapBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>返回</span></button>
    <div class="map-title">认知地图</div>
    <div class="map-controls" aria-label="地图缩放">
      <button class="map-zoom-btn" id="mapZoomOut" title="缩小" aria-label="缩小">−</button>
      <button class="map-zoom-btn" id="mapZoomIn" title="放大" aria-label="放大">＋</button>
      <button class="map-zoom-btn map-zoom-reset" id="mapZoomReset" title="复位">复位</button>
    </div>

/* ============ HELPERS ============ */
function escapeHTML(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function escapeAttr(s){return escapeHTML(s)}
function safeExternalUrl(url){try{const parsed=new URL(String(url),window.location.origin);return parsed.protocol==='http:'||parsed.protocol==='https:'?parsed.href:''}catch(e){return''}}

function compareNotes(a,b){const ap=a.pinned_at?1:0,bp=b.pinned_at?1:0;if(ap!==bp)return bp-ap;if(ap)return String(b.pinned_at).localeCompare(String(a.pinned_at));return noteSortKey(b).localeCompare(noteSortKey(a))}
let draftRevisionSeq=0;
function nextDraftRevision(){draftRevisionSeq+=1;return Date.now().toString(36)+'-'+draftRevisionSeq.toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function saveDraft(key,value){try{const revision=nextDraftRevision(),stored={value,_draftRevision:revision};localStorage.setItem(key,JSON.stringify(stored));return revision}catch(e){showToast('本地草稿保存失败');return null}}
function readDraft(key,fallback){try{const stored=JSON.parse(localStorage.getItem(key));if(stored&&typeof stored==='object'&&Object.prototype.hasOwnProperty.call(stored,'value')&&Object.prototype.hasOwnProperty.call(stored,'_draftRevision'))return stored.value??fallback;return stored??fallback}catch(e){return fallback}}
function getDraftRevision(key){try{const stored=JSON.parse(localStorage.getItem(key));return stored&&typeof stored==='object'&&stored._draftRevision||null}catch(e){return null}}
function clearDraft(key){try{localStorage.removeItem(key)}catch(e){}}
function clearDraftIfRevision(key,expectedRevision){if(getDraftRevision(key)!==expectedRevision)return false;clearDraft(key);return true}
function touchDraftRevision(key){const value=readDraft(key,null);return value===null?null:saveDraft(key,value)}
function draftStorageKey(base,userId=currentUserId){return base+':'+(userId||'signed-out')}
function quickDraftKey(){return draftStorageKey(QUICK_DRAFT_KEY)}
function newDraftKey(){return draftStorageKey(NEW_DRAFT_KEY)}

function isUploadSessionCurrent(capturedSession,currentSession,capturedKey,currentKey,visible){return capturedSession===currentSession&&capturedKey===currentKey&&visible}
function migrateLegacyDrafts(){
  if(!currentUserId)return;
  [[QUICK_DRAFT_KEY,quickDraftKey()],[NEW_DRAFT_KEY,newDraftKey()]].forEach(([legacy,scoped])=>{if(localStorage.getItem(scoped)===null&&localStorage.getItem(legacy)!==null)localStorage.setItem(scoped,localStorage.getItem(legacy));localStorage.removeItem(legacy)});
  const legacyEdit=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith(EDIT_DRAFT_PREFIX)&&!key.includes(':'))legacyEdit.push(key)}
  legacyEdit.forEach(key=>{const scoped=draftStorageKey(key);if(localStorage.getItem(scoped)===null)localStorage.setItem(scoped,localStorage.getItem(key));localStorage.removeItem(key)});
}
function todayDate(){return nowTs().slice(0,10)}
function parseTags(value){return value.trim()?value.trim().split(/\s+/).map(s=>s.replace(/^#/,'')).filter(Boolean):[]}
function nowTs(){const n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2)+' '+('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)}
function fmtTime(s){const d=new Date(s.replace(/-/g,'/'));return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function fmtDate(s){
  const d=new Date(s.replace(/-/g,'/'));const now=new Date();const today=new Date(now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate());const yest=new Date(today);yest.setDate(yest.getDate()-1);
  const dd=new Date(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate());
  if(dd.getTime()===today.getTime())return{label:'今天',sub:'今天',isToday:true};
  if(dd.getTime()===yest.getTime())return{label:'昨天',sub:'昨天',isToday:false};
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),ny=now.getFullYear();
  if(y===ny)return{label:m+'月'+day+'日',sub:m+'月'+day+'日',isToday:false};
  if(y===ny-1)return{label:'去年'+m+'月'+day+'日',sub:'去年'+m+'月'+day+'日',isToday:false};
  return{label:y+'年'+m+'月'+day+'日',sub:y+'年'+m+'月'+day+'日',isToday:false};
}
function noteTitle(n){
  const first=String(n.text||'').split('\n')[0].replace(/[#*`>\-\[\]]/g,'').trim();
  // 跳过开头无意义标点/省略号/空白，取第一个实词片段
  const cleaned=first.replace(/^[…\.\。，、；：！？\s\-—~·]+/,'').trim();
  const t=(cleaned||first).slice(0,30);
  return t||('笔记 '+n.id);
}
function findNoteByTitle(t){return notes.find(n=>noteTitle(n)===t)}
function noteLinkLabel(n){return noteTitle(n)||('笔记 '+n.id)}
function noteLinkToken(n){return '#'+n.id+'|'+noteLinkLabel(n)}
function parseBilink(value){const raw=String(value||''),stable=raw.match(/^#(\d+)\|(.*)$/s);if(stable){const id=Number(stable[1]),note=notes.find(n=>n.id===id);return{id,label:note?noteLinkLabel(note):(stable[2]||('笔记 '+id)),note}}const note=findNoteByTitle(raw);return{id:note?note.id:null,label:raw,note}}
function stripBilinks(text){return String(text||'').replace(/\[\[(.+?)\]\]/g,(m,value)=>parseBilink(value).label)}
function getForwardLinks(n){return(n.text.match(/\[\[(.+?)\]\]/g)||[]).map(m=>parseBilink(m.slice(2,-2))).map(ref=>({title:ref.label,note:ref.note})).filter(x=>x.note)}
function getBacklinks(n){
  const title=noteTitle(n),stable='[[#'+n.id+'|';
  return notes.filter(o=>o.id!==n.id&&(
    o.text.includes(stable)||(title&&o.text.includes('[['+title+']]'))
  ));
}

/* ============ MARKDOWN ============ */
function renderMD(text){
  const links=[];
  const bilinks=[];
  text=String(text??'').replace(/\[\[(.+?)\]\]/g,(m,value)=>{const ref=parseBilink(value),token='\u0000BILINK'+bilinks.length+'\u0000';bilinks.push(ref.note?`<a class="bilink" data-note-id="${Number(ref.note.id)}" title="${escapeAttr(ref.note.text.slice(0,40))}">${escapeHTML(ref.label)}</a>`:`<span class="bilink broken">${escapeHTML(ref.label)}</span>`);return token});
  text=text.replace(/\[([^\]]+?)\]\(([^\s)]+)\)/g,(m,label,url)=>{const safe=safeExternalUrl(url);if(!safe)return label;const token='\u0000LINK'+links.length+'\u0000';links.push(`<a href="${escapeAttr(safe)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label)}</a>`);return token});
  let html=escapeHTML(text);
  html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  html=html.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  html=html.replace(/^\d+\. (.+)$/gm,'<oli>$1</oli>').replace(/(<oli>.*<\/oli>(?:\n|$))+/g,m=>{const trailing=m.endsWith('\n')?'\n':'',body=trailing?m.slice(0,-1):m;return'<ol>'+body.replace(/<oli>/g,'<li>').replace(/<\/oli>/g,'</li>')+'</ol>'+trailing});
  html=html.replace(/^[\-\*] (.+)$/gm,'<uli>$1</uli>').replace(/(<uli>.*<\/uli>(?:\n|$))+/g,m=>{const trailing=m.endsWith('\n')?'\n':'',body=trailing?m.slice(0,-1):m;return'<ul>'+body.replace(/<uli>/g,'<li>').replace(/<\/uli>/g,'</li>')+'</ul>'+trailing});
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
  html=html.replace(/\n/g,'<br>').replace(/\u0000LINK(\d+)\u0000/g,(m,i)=>links[Number(i)]||'').replace(/\u0000BILINK(\d+)\u0000/g,(m,i)=>bilinks[Number(i)]||'');
  html=html.replace(/<br>(<(?:h[123]|blockquote|ul|ol|li))/g,'$1').replace(/(<\/(?:h[123]|blockquote|ul|ol|li)>)<br>/g,'$1');
  return html;
}
function applyMarkdown(type,ta){
  const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.substring(s,e),before=ta.value.substring(0,s),after=ta.value.substring(e);
  let ins='',co=0;
  switch(type){case'bold':ins=sel?'**'+sel+'**':'**粗体**';co=sel?0:2;break;case'italic':ins=sel?'*'+sel+'*':'*斜体*';co=sel?0:2;break;case'code':ins=sel?'`'+sel+'`':'`代码`';co=sel?0:2;break;case'h':ins='### '+(sel||'标题');co=sel?0:2;break;case'quote':ins='> '+(sel||'引用');co=sel?0:2;break;case'list':ins='- '+(sel||'列表项');co=sel?0:3;break;case'numbered':ins='1. '+(sel||'列表项');co=sel?0:3;break;case'link':ins='['+(sel||'链接文字')+'](https://)';break;case'bilink':ins='@';break}
  ta.value=before+ins+after;
  if(sel){ta.selectionStart=s;ta.selectionEnd=s+ins.length}else{ta.selectionStart=ta.selectionEnd=s+ins.length-co}
  ta.focus();ta.dispatchEvent(new Event('input'));
}

function renderHeatmap(){

  const monthsEl=document.getElementById('heatmapMonths');
  const countEl=document.getElementById('heatmapCount');
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const daysInMonth=new Date(y,m+1,0).getDate();
  // 周一对齐：getDay() 周日=0 → 偏移 6，周一=1 → 偏移 0
  const offset=(new Date(y,m,1).getDay()+6)%7;
  const todayKey=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2);
  const dailyCount={};
  notes.forEach(n=>{const d=noteDate(n);dailyCount[d]=(dailyCount[d]||0)+1});
  const cells=[];
  for(let i=0;i<offset;i++)cells.push('<div class="heatmap-cell heat-empty"></div>');
  for(let d=1;d<=daysInMonth;d++){
    const key=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);
    const cnt=dailyCount[key]||0;
    let lvl=0;
    if(cnt>=4)lvl=4;else if(cnt>=3)lvl=3;else if(cnt>=2)lvl=2;else if(cnt>=1)lvl=1;
    cells.push(`<div class="heatmap-cell${lvl?' l'+lvl:''}${key===todayKey?' today':''}" title="${key}: ${cnt}篇"></div>`);
  }
  grid.innerHTML=cells.join('');
  monthsEl.innerHTML=`<span>${y}年${m+1}月</span>`;
  countEl.textContent=notes.length+' 篇';
}

/* ============ TREE ============ */
function buildTree(){const root=Object.create(null);notes.forEach(n=>{n.tags.forEach(t=>{const parts=t.split('/');let node=root;parts.forEach(p=>{if(!Object.hasOwn(node,p))node[p]={_count:0,_children:Object.create(null)};node[p]._count++;node=node[p]._children})})});return root}
function renderTree(){
  const root=buildTree(),el=document.getElementById('tree');let html='';
  html+=`<li class="tree-item tree-leaf"><div class="tree-row ${!currentTag?'active':''}" data-tag="__all__"><span class="tree-toggle">›</span><span class="tree-label">全部笔记</span><span class="tree-count">${notes.length}</span></div></li>`;
  function walk(node,path){Object.keys(node).sort().forEach(k=>{const item=node[k],fp=path?path+'/'+k:k,hc=Object.keys(item._children).length>0,isActive=currentTag===fp;
    html+=`<li class="tree-item ${hc?'open':''} ${!hc?'tree-leaf':''}"><div class="tree-row ${isActive?'active':''}" data-tag="${escapeAttr(fp)}"><span class="tree-toggle">${hc?'›':'·'}</span><span class="tree-label">${escapeHTML(k)}</span><span class="tree-count">${item._count}</span></div>`;
    if(hc){html+='<ul class="tree-children">';walk(item._children,fp);html+='</ul>'}
    html+='</li>'})}
  walk(root,'');el.innerHTML=html;
}
function selectTag(tag){currentTag=(tag==='__all__')?null:tag;currentPage=1;renderTree();updateTopbarTag();render();closeSidebarMobile()}
function updateTopbarTag(){const el=document.getElementById('topbarTag');if(currentTag){el.textContent='#'+currentTag+' ×';el.classList.add('show')}else el.classList.remove('show')}
document.getElementById('topbarTag').addEventListener('click',()=>selectTag('__all__'));
document.getElementById('tree').addEventListener('click',function(e){
  const toggle=e.target.closest('.tree-toggle'),row=e.target.closest('.tree-row');if(!row)return;
  const item=row.closest('.tree-item');
  if(toggle&&!item.classList.contains('tree-leaf')){e.stopPropagation();e.preventDefault();item.classList.toggle('open');return}
  e.preventDefault();selectTag(row.dataset.tag);
});

function renderFeed(list){
  const el=document.getElementById('feed');
  const pinned=list.filter(n=>n.pinned_at).sort((a,b)=>String(b.pinned_at).localeCompare(String(a.pinned_at)));
  const rest=list.filter(n=>!n.pinned_at).sort((a,b)=>noteSortKey(b).localeCompare(noteSortKey(a)));
  const totalPages=Math.max(1,Math.ceil(rest.length/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  if(currentPage<1)currentPage=1;
  const pageRest=rest.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);

  let html=inputCardHTML();
  // 置顶区（每页都钉顶，独立视觉区）
  if(pinned.length){
    html+=`<div class="pin-zone"><div class="pin-zone-head"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>置顶 · ${pinned.length}</div>`;
    pinned.forEach(n=>html+=noteCardFull(n));
    html+='</div>';
  }
  // 当页笔记（按日期分组）
  if(pageRest.length===0&&!pinned.length){html+=emptyHTML();el.innerHTML=html;bindInputCard();renderPagination(0,0);return}
  const groups={};
  pageRest.forEach(n=>{const k=noteDate(n);if(!groups[k])groups[k]=[];groups[k].push(n)});
  Object.keys(groups).forEach(date=>{const info=fmtDate(date);html+=`<div class="date-sep${info.isToday?' today':''}">${info.sub}</div>`;groups[date].forEach(n=>html+=noteCardFull(n))});
  el.innerHTML=html;bindInputCard();
  renderPagination(totalPages,rest.length);
}

const detailMask=document.getElementById('detailMask'),detailContent=document.getElementById('detailContent');
let detailEditTextarea=null;
let detailPendingImgs=[];
let detailOriginalImgs=[];
let detailEditSession=0;
let detailSaveInFlight=false;
const imageUrlCache=new Map();
function isLegacyImageUrl(value){return /^https?:\/\//i.test(String(value||''))}
function isSignedUrlCacheFresh(entry,now=Date.now()){return !!entry&&entry.expiresAt>now+60000}
async function resolveImageUrl(value){
  if(isLegacyImageUrl(value))return safeExternalUrl(value);
  const path=String(value||'');if(!path||path.startsWith('/')||path.includes('..'))return'';
  const cached=imageUrlCache.get(path);if(isSignedUrlCacheFresh(cached))return cached.url;
  const {data,error}=await sb.storage.from('note-images').createSignedUrl(path,3600);
  const url=error?'':safeExternalUrl(data&&data.signedUrl);if(url)imageUrlCache.set(path,{url,expiresAt:Date.now()+3600*1000});return url;
}
async function removeStoragePaths(paths,failMessage='图片清理失败，请稍后重试'){
  const clean=[...new Set((paths||[]).filter(path=>path&&!isLegacyImageUrl(path)))];if(!clean.length)return true;
  const {error}=await sb.storage.from('note-images').remove(clean);if(error){showToast(failMessage);return false}clean.forEach(path=>imageUrlCache.delete(path));return true;
}
async function renderImageList(container,values,editable){
  if(!container)return;container.textContent='';
  const urls=await Promise.all(values.map(resolveImageUrl));
  urls.forEach((url,i)=>{if(!url)return;const wrap=document.createElement('div');wrap.className='img-thumb';const img=document.createElement('img');img.src=url;img.alt='笔记图片';img.loading='lazy';wrap.appendChild(img);if(editable){const del=document.createElement('button');del.className='img-thumb-del';del.type='button';del.textContent='×';del.dataset.imageIndex=String(i);del.setAttribute('aria-label','删除图片');wrap.appendChild(del)}else{wrap.className='';img.addEventListener('click',()=>openLightbox(url))}container.appendChild(wrap)});
}
async function renderDetailImages(n){const grid=document.getElementById('detailImgsGrid');if(!grid)return;await renderImageList(grid,n.imgs||[],false);grid.classList.toggle('single',(n.imgs||[]).length===1)}
function persistDetailDraft(){if(!currentDetailId||!detailEditTextarea)return;const n=notes.find(x=>x.id===currentDetailId);if(!n)return;saveDraft(editDraftKey(currentDetailId),{text:detailEditTextarea.value,tags:document.getElementById('detailEditTags').value,recorded_on:document.getElementById('detailEditRecordedOn').value,imgs:[...detailPendingImgs],base_updated_at:n.updated_at})}
function setDetailSaving(saving){detailSaveInFlight=saving;['detailBack','detailMenuBtn','detailEditSave'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=saving});detailContent.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=saving)}
function toggleDetailEditorOption(panelId,buttonId){const options=document.getElementById('detailEditorOptions'),panel=document.getElementById(panelId),button=document.getElementById(buttonId);if(!options||!panel||!button)return;const opening=panel.hidden;options.querySelectorAll('.detail-editor-option').forEach(el=>el.hidden=true);detailContent.querySelectorAll('#detailTagTool,#detailDateTool').forEach(el=>el.classList.remove('active'));if(opening){options.hidden=false;panel.hidden=false;button.classList.add('active');const input=panel.querySelector('input');if(input)setTimeout(()=>input.focus(),0)}else options.hidden=true}
function openDetail(id){
  detailEditSession++;const n=findLoadedNote(id);if(!n)return;currentDetailId=id;detailMask.classList.remove('editing');hideNoteMenu();
  document.getElementById('detailBackText').textContent='返回';

  const fwd=getForwardLinks(n),back=getBacklinks(n);let links='';
  if(fwd.length||back.length){links='<div class="detail-links">';if(fwd.length){links+='<div class="detail-links-title"><span class="arrow">→</span> 引用了</div>';fwd.forEach(l=>links+=linkCardHTML(l.note))}if(back.length){links+='<div class="detail-links-title" style="margin-top:16px"><span class="arrow">←</span> 被引用</div>';back.forEach(b=>links+=linkCardHTML(b))}links+='</div>'}
  detailContent.innerHTML=`<div class="detail-inner"><div class="detail-ts"><span class="dot"></span>${fd} · ${fmtTime(n.time)}</div><div class="detail-txt">${renderMD(n.text)}</div>${imgs}${tagsHTML?`<div class="detail-tags">${tagsHTML}</div>`:''}${links}</div>`;

async function openDetailEdit(id){
  const session=++detailEditSession,n=findLoadedNote(id);if(!n)return;currentDetailId=id;detailMask.classList.add('editing');hideNoteMenu();
  document.getElementById('detailBackText').textContent='取消';
  let draft=readDraft(editDraftKey(id),null);
  if(!isEditDraftCurrent(draft,n)){const staleUploads=(draft.imgs||[]).filter(path=>!n.imgs.includes(path));if(!await removeStoragePaths(staleUploads,'旧草稿图片清理失败')){if(session===detailEditSession)detailMask.classList.remove('editing');return}if(session!==detailEditSession)return;clearDraft(editDraftKey(id));draft=null;showToast('笔记已更新，已忽略旧编辑草稿')}
  if(session!==detailEditSession||currentDetailId!==id)return;
  draft=draft||{text:n.text,tags:n.tags.join(' '),recorded_on:n.recorded_on||'',imgs:[...n.imgs],base_updated_at:n.updated_at};

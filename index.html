function seededRandom(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function parseEmbedding(e){if(!e)return null;if(Array.isArray(e))return e;try{const v=JSON.parse(e);return Array.isArray(v)?v:null}catch{return null}}
function normalizeVec(v){let n=0;for(let i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;return v.map(x=>x/n)}
function dotVec(a,b){let s=0;const n=Math.min(a.length,b.length);for(let i=0;i<n;i++)s+=a[i]*b[i];return s}

function stripSemanticNoise(text){
  const raw=String(text||''),marker=/\n\s*(?:(?:---|\*\*\*)\s*)?🐰月儿来信\s*[:：]?/i,match=marker.exec(raw);
  return (match?raw.slice(0,match.index):raw).trim();
}

// 默认地图只解释真实个人记录；自动采集与纯链接仍保留在笔记流，但不参与主题命名。
function isSubstantiveMapNote(note){
  const tags=note.tags||[],raw=stripSemanticNoise(note.text);
  if(tags.includes('IFTTT')||tags.includes('Day One/Ifttt 自动化'))return false;
  if(/(^|\n)\s*(转@|转发|微博正文)|the latest stories on twitter/i.test(raw))return false;
  const clean=raw
    .replace(/https?:\/\/[^\s)\]]+/gi,' ')
    .replace(/<https?:\/\/[^>]+>/gi,' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
    .replace(/dayone-moment:\S+/gi,' ')
    .replace(/[#*`>\[\]()_\\]/g,' ')
    .replace(/\s+/g,'');
  return clean.length>=25;
}

const STOP_WORDS=new Set(('的,了,和,是,在,我,有,就,不,人,都,一,一个,上,也,很,到,说,要,去,你,会,着,没有,看,好,自己,这,这个,这些,那,那个,那些,他,她,它,我们,他们,以及,或者,因为,所以,但是,如果,虽然,已经,还是,就是,什么,怎么,为什么,可以,可能,应该,今天,昨天,明天,现在,时候,问题,东西,事情,地方,觉得,知道,这样,那样,还有,只是,不是,不能,不要,一点,一些,一直,一种,一样,工作,进行,相关,通过,对于,关于,目前,然后,之后,之前,学校,老师,学生,课堂,课程,记录,真的,感觉,这么,那么,正在,都是,日记,笔记,生活,后来,开始,我的,你的,他的,她的,它的,这种,那种,这里,那里,起来,下来,到了,过了,还是,有点,变得,听起来,看起来,接下来,想得到,完了,来自,其中,一天,一次,一段,一种,一些,一件,一样,前天,明天,晚上,早上,中午,下午,当时,最近,最后,终于,大概,其实,依然,仍然,完全,非常,特别,比较,好像,大概,大约,很多,好多,越来越').split(','));
const GENERIC_THEME_TERMS=new Set(('via,快乐,传染,时间,也是,需要,而是,过程,本身,人的,我在,只有,努力,发生,处理,能力,重要,价值,选择,直接,出来,无法,比如,之间,真实,方式,理解,不知道,看到,发现,一起,的话,似乎,每天,舒服,回来,想起,结果,有人,里面,总之,不过,我也,使用,小时').split(','));
const CONCEPT_SINGLE_CHARS=new Set(['梦','爱','猫','性','钱','家','病','死','书','酒','药','痛','怕']);
const ZH_SEGMENTER=typeof Intl!=='undefined'&&Intl.Segmenter?new Intl.Segmenter('zh-CN',{granularity:'word'}):null;
function extractTerms(text){
  const terms={},clean=String(text||'').replace(/https?:\/\/[^\s)\]]+/gi,' ').replace(/\bwww\.[^\s)\]]+/gi,' ').replace(/[\w.-]+\.(com|cn|net|io|org|me|cc|top|xyz|link)\b/gi,' ').replace(/\b\d+([.:]\d+)*\b/g,' ').replace(/[#*`>\[\]()【】「」『』、，。！？；："“”'‘’—…·]/g,' ');
  const parts=ZH_SEGMENTER?[...ZH_SEGMENTER.segment(clean)]:clean.split(/\s+/).map(segment=>({segment,isWordLike:true}));
  const EN_STOP=new Set(['https','http','www','com','net','org','html','provided','youtube','twitter','instagram','september','august','this','that','with','from','have','via']);
  for(const part of parts){
    if(!part.isWordLike)continue;
    const w=part.segment.trim().toLowerCase();if(!w||/^\d+$/.test(w)||STOP_WORDS.has(w))continue;
    if(/^[一-龥]+$/.test(w)){if(w.length===1&&!CONCEPT_SINGLE_CHARS.has(w))continue;if(w.length>8)continue;terms[w]=(terms[w]||0)+1;continue}
    if(/^[a-z][a-z0-9]{2,}$/.test(w)&&!EN_STOP.has(w))terms[w]=(terms[w]||0)+1;
  }
  return terms;
}
function canonicalThemeTerm(w){return /^(梦|梦到|梦里|梦境|梦中|梦见|做梦)$/.test(w)?'梦境':w}
function themeTermSet(text){return new Set(Object.keys(extractTerms(text)).map(canonicalThemeTerm))}

// 主题名必须来自多篇正文中的共同且有区分度的概念；不再使用标签兜底。
function nameThemeFromContent(members,globalDocFreq,totalDocs){
  const freq={};
  members.forEach(m=>themeTermSet(stripSemanticNoise(stripBilinks(m.note.text||''))).forEach(w=>freq[w]=(freq[w]||0)+1));
  const minDocs=Math.max(3,Math.ceil(members.length*0.08));
  const groundedLabels=[
    {terms:['快捷','指令'],label:'数字工具与快捷指令'},
    {terms:['跑步'],label:'跑步与身体训练'},
    {terms:['梦境'],label:'梦境与往事'},
    {terms:['关系','自我'],label:'关系与自我'}
  ];
  const grounded=groundedLabels.find(rule=>rule.terms.every(w=>(freq[w]||0)>=minDocs));
  if(grounded)return grounded.label;
  const cands=Object.entries(freq).filter(([w,c])=>c>=minDocs&&!GENERIC_THEME_TERMS.has(w)&&(w.length>=2||CONCEPT_SINGLE_CHARS.has(w))).map(([w,c])=>{
    const distinct=Math.log((totalDocs+1)/((globalDocFreq[w]||c)+1))+1;
    return{w,c,score:(c/members.length)*distinct*Math.log(2+w.length)};
  }).sort((a,b)=>b.score-a.score||b.c-a.c);
  const picked=[];
  for(const cand of cands){if(picked.some(p=>p.w.includes(cand.w)||cand.w.includes(p.w)))continue;picked.push(cand);if(picked.length===2)break}
  if(!picked.length)return null;
  if(picked.length===2){
    const joined=[picked[0].w+picked[1].w,picked[1].w+picked[0].w].find(term=>members.filter(m=>stripSemanticNoise(m.note.text).includes(term)).length>=minDocs);
    if(joined)return joined.slice(0,18);
  }
  return picked.map(x=>x.w).join(' · ').slice(0,18);
}

// 确定性的球面 K-Means：只负责提出候选主题；质量围栏决定候选能否被展示。
function sphericalKMeans(pts,k){
  pts.forEach(p=>p.unitVec=normalizeVec(p.vec));
  const n=pts.length,centroids=[];
  centroids.push([...pts[(0xF1A5C0DE>>>0)%n].unitVec]);
  while(centroids.length<k){
    let best=0,bestDist=-1;
    for(let i=0;i<n;i++){const maxSim=Math.max(...centroids.map(c=>dotVec(pts[i].unitVec,c))),dist=1-maxSim;if(dist>bestDist){bestDist=dist;best=i}}
    centroids.push([...pts[best].unitVec]);
  }
  const assignments=new Array(n).fill(-1);
  for(let iter=0;iter<14;iter++){
    let changed=false;
    for(let i=0;i<n;i++){let bi=0,bs=-Infinity;for(let c=0;c<k;c++){const s=dotVec(pts[i].unitVec,centroids[c]);if(s>bs){bs=s;bi=c}}if(assignments[i]!==bi){assignments[i]=bi;changed=true}}
    const sums=Array.from({length:k},()=>new Array(pts[0].unitVec.length).fill(0)),counts=new Array(k).fill(0);
    for(let i=0;i<n;i++){const c=assignments[i];counts[c]++;for(let d=0;d<sums[c].length;d++)sums[c][d]+=pts[i].unitVec[d]}
    for(let c=0;c<k;c++)if(counts[c])centroids[c]=normalizeVec(sums[c]);
    if(!changed&&iter>1)break;
  }
  return centroids.map((centroid,index)=>({index,centroid,members:pts.filter((_,i)=>assignments[i]===index)})).filter(x=>x.members.length);
}

function findMeaningfulThemes(pts){
  const k=Math.max(3,Math.min(8,Math.round(Math.sqrt(pts.length/15))));
  const raw=sphericalKMeans(pts,k),globalDocFreq={};
  pts.forEach(p=>themeTermSet(stripSemanticNoise(stripBilinks(p.note.text||''))).forEach(w=>globalDocFreq[w]=(globalDocFreq[w]||0)+1));
  const minThemeSize=Math.max(6,Math.ceil(pts.length*0.05));
  raw.forEach(theme=>{
    const own=theme.members.map(p=>dotVec(p.unitVec,theme.centroid));
    const margins=theme.members.map((p,i)=>own[i]-Math.max(...raw.filter(t=>t!==theme).map(t=>dotVec(p.unitVec,t.centroid))));
    const cohesion=own.reduce((a,b)=>a+b,0)/own.length,margin=margins.reduce((a,b)=>a+b,0)/margins.length;
    const name=nameThemeFromContent(theme.members,globalDocFreq,pts.length);
    theme.cohesion=cohesion;theme.margin=margin;theme.name=name;
    theme.qualified=theme.members.length>=minThemeSize&&cohesion>=THEME_MIN_COHESION&&margin>=THEME_MIN_MARGIN&&Boolean(name);
    theme.representatives=theme.members.map((p,i)=>({p,score:own[i]})).sort((a,b)=>b.score-a.score).slice(0,4).map(x=>x.p);
    if(theme.qualified)theme.members.forEach(p=>p.theme=theme);
  });
  return raw;
}

function renderThemeFence(theme,parent,W,H,svgNS,green){
  const gridN=56,cellW=W/gridN,cellH=H/gridN,density=new Array(gridN*gridN).fill(0),sigma=Math.max(2.5,Math.min(4.5,Math.sqrt(theme.members.length)*0.48));

/* ============ WANDER（随机漫步） ============ */
const wanderMask=document.getElementById('wanderMask'),wanderDeck=document.getElementById('wanderDeck'),wanderNext=document.getElementById('wanderNext'),wanderCount=document.getElementById('wanderCount');
let wanderList=[],wanderIdx=0,wanderAnimating=false,wanderSession=0;
const WANDER_MAX=10,WANDER_SEED_MIN=0.55,WANDER_SEED_MAX=0.82;

function noteVecCache(){if(!window._vecCache)window._vecCache=new Map();return window._vecCache}
async function ensureVecsLoaded(){
  if(window._vecsLoaded)return true;
  const {data,error}=await sb.from('notes').select('id,embedding').not('embedding','is',null).is('deleted_at',null);
  if(error)return false; // 失败不标记，下次重试
  const c=noteVecCache();c.clear();
  (data||[]).forEach(r=>{const v=parseEmbedding(r.embedding);if(v&&v.length)c.set(r.id,v)});
  window._vecsLoaded=true;return true;
}
async function fetchNoteVec(id){await ensureVecsLoaded();return noteVecCache().get(id)||null}
function invalidateVecs(){window._vecsLoaded=false}
// 新增/编辑/恢复/删除笔记后调用，下一次漫步重新拉向量
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}

// 三幕：那年今日 → 那年临近 → 纯随机（开场两幕只看历史年份）
async function buildWanderList(){
  const list=[],used=new Set();
  const push=n=>{if(n&&!used.has(n.id)&&list.length<WANDER_MAX){used.add(n.id);list.push(n)}};
  const now=new Date(),md=('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2),curYear=String(now.getFullYear());
  const pool=notes.filter(n=>n.text&&n.text.trim());
  if(!pool.length)return list;

  // 第一幕：那年今日（仅历史年份的同月日）
  const sameDay=pool.filter(n=>noteDate(n).slice(5)===md&&noteDate(n).slice(0,4)!==curYear);
  sameDay.sort(()=>Math.random()-.5).slice(0,2).forEach(push);
  // 第二幕：那年临近（仅历史年份，环形月日距离 ±3 天）
  if(list.length<2){
    const near=pool.filter(n=>{const d=noteDate(n);return d.slice(0,4)!==curYear&&d.slice(5)!==md&&monthDayDistance(d.slice(5),md)<=3&&!used.has(n.id)});
    near.sort(()=>Math.random()-.5).slice(0,2-list.length).forEach(push);
  }
  // 第三幕：纯随机填满剩余（含今年，排除已选）
  pool.filter(n=>!used.has(n.id)).sort(()=>Math.random()-.5).forEach(push);
  return list;
}
function monthDayOrdinal(md){const[m,d]=md.split('-').map(Number);return Math.floor(Date.UTC(2000,m-1,d)/86400000)}
function monthDayDistance(a,b){const diff=Math.abs(monthDayOrdinal(a)-monthDayOrdinal(b));return Math.min(diff,366-diff)}

function wanderCardHTML(n){
  const tags=n.tags.map(t=>`<span class="wander-card-tag">${escapeHTML(t)}</span>`).join('');
  return `<button class="wander-card-menu" data-wander-menu="${Number(n.id)}" title="更多"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
  <div class="wander-card-date"><span class="dot"></span>${fmtDate(noteDate(n)).sub} · ${fmtTime(n.time)}</div>
  <div class="wander-card-text">${renderMD(n.text)}</div>
  <div class="wander-card-foot"><div class="wander-card-tags">${tags}</div><button class="wander-expand" data-wander-expand="${Number(n.id)}">展开</button></div>`;
}
function renderWanderDeck(){
  wanderDeck.innerHTML='';
  const cur=wanderList[wanderIdx],n1=wanderList[wanderIdx+1],n2=wanderList[wanderIdx+2];
  if(n2){const c=document.createElement('div');c.className='wander-card ghost2';wanderDeck.appendChild(c)}
  if(n1){const c=document.createElement('div');c.className='wander-card ghost1';wanderDeck.appendChild(c)}
  if(!cur){wanderDeck.innerHTML='<div class="wander-empty"><p>这次漫步没有可看的笔记</p></div>';return}
  const card=document.createElement('div');card.className='wander-card';card.dataset.pos='cur';card.innerHTML=wanderCardHTML(cur);
  wanderDeck.appendChild(card);
  wanderCount.textContent=(wanderIdx+1)+' / '+wanderList.length;
  const isLast=wanderIdx>=wanderList.length-1;
  wanderNext.textContent=isLast?'结束漫步':'下一张';
}
function wanderAdvance(){
  if(wanderAnimating)return;
  const isLast=wanderIdx>=wanderList.length-1;
  if(isLast){closeWander();return} // 10 张结束，只能返回，不再续刷
  const cur=wanderDeck.querySelector('.wander-card[data-pos="cur"]');
  wanderAnimating=true;
  wanderIdx++;
  const next=wanderList[wanderIdx];
  const ncard=document.createElement('div');ncard.className='wander-card fly-in';ncard.dataset.pos='cur';ncard.innerHTML=wanderCardHTML(next);
  const ghosts=wanderDeck.querySelectorAll('.wander-card.ghost1,.wander-card.ghost2');ghosts.forEach(g=>g.remove());
  if(cur){cur.classList.add('fly-out');cur.removeAttribute('data-pos')}
  wanderDeck.appendChild(ncard);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{ncard.classList.remove('fly-in')})});
  wanderCount.textContent=(wanderIdx+1)+' / '+wanderList.length;
  wanderNext.textContent=wanderIdx>=wanderList.length-1?'结束漫步':'下一张';
  setTimeout(()=>{if(cur)cur.remove();renderWanderDeck();wanderAnimating=false},340);
}
async function startWander(){
  const session=++wanderSession;
  wanderNext.disabled=true;wanderNext.textContent='漫步中...';wanderCount.textContent='';
  wanderDeck.innerHTML='<div class="wander-empty"><p style="animation:pulse 1.5s ease-in-out infinite">正在整理牌堆...</p></div>';
  const result=await buildWanderList();
  if(session!==wanderSession)return; // 已被关闭/重启，丢弃过期结果
  wanderList=result;wanderIdx=0;wanderAnimating=false;
  wanderNext.disabled=false;
  renderWanderDeck();
}
function openWander(){closeSidebarMobile();hideNoteMenu();wanderMask.classList.add('show');startWander()}
function closeWander(){wanderSession++;hideNoteMenu();wanderMask.classList.remove('show')}

wanderDeck.addEventListener('click',function(e){

let insightRelated=[],insightSelected=new Set(),insightBatchBusy=false,insightReturnToWander=false;
const batchTagMask=document.getElementById('batchTagMask'),batchTagInput=document.getElementById('batchTagInput');
setupTagSuggest(batchTagInput);
function mergeTags(existing,added){return [...new Set([...(existing||[]),...added])]}
document.getElementById('insightBatchTagBtn').addEventListener('click',()=>{
  if(!insightSelected.size)return;
  batchTagInput.value='';
  document.getElementById('batchTagDesc').textContent=`为 ${insightSelected.size} 条笔记追加标签，不会移除原有标签`;
  batchTagMask.classList.add('show');
  setTimeout(()=>batchTagInput.focus(),100);
});
document.getElementById('batchTagCancel').addEventListener('click',()=>batchTagMask.classList.remove('show'));
batchTagMask.addEventListener('click',e=>{if(e.target===batchTagMask)batchTagMask.classList.remove('show')});
document.getElementById('batchTagSubmit').addEventListener('click',async()=>{
  if(insightBatchBusy)return;
  const newTags=[...new Set(parseTags(batchTagInput.value))];
  if(!newTags.length){showToast('请输入至少一个标签');return}
  const ids=[...insightSelected];
  insightBatchBusy=true;const submitBtn=document.getElementById('batchTagSubmit');submitBtn.disabled=true;submitBtn.textContent='添加中...';
  try{
    // 先取最新 tags+updated_at，避免覆盖并发修改
    const {data:rows,error}=await sb.from('notes').select('id,tags,updated_at').in('id',ids).is('deleted_at',null);
    if(error)throw error;
    let ok=0,fail=0,nochange=0;
    await Promise.allSettled((rows||[]).map(async row=>{
      const merged=mergeTags(row.tags,newTags);
      if(merged.length===(row.tags||[]).length){nochange++;return}
      const {data,error:uerr}=await sb.from('notes').update({tags:merged}).eq('id',row.id).eq('updated_at',row.updated_at).select('id,tags,updated_at');
      if(uerr||!data||!data.length){fail++;return}
      ok++;
      // 同步本地
      const saved=data[0];const local=notes.find(n=>n.id===row.id);if(local){local.tags=saved.tags;local.updated_at=saved.updated_at}
      const rel=insightRelated.find(n=>n.id===row.id);if(rel){rel.tags=saved.tags;rel.updated_at=saved.updated_at}
    }));
    batchTagMask.classList.remove('show');
    invalidateVecs();renderTree();render();
    // 重新渲染洞察页（标签变了，向量不变，不重算近邻）
    if(insightSourceId!==null){const src=notes.find(n=>n.id===insightSourceId);if(src){renderInsightSource(src);renderInsightList(src,insightRelated)}}
    const failedIds=ids.filter(id=>{const r=(rows||[]).find(x=>x.id===id);return r&&(mergeTags(r.tags,newTags).length>(r.tags||[]).length)&&!notes.find(n=>n.id===id&&newTags.every(t=>n.tags.includes(t)))});
    insightSelected.clear();failedIds.forEach(id=>insightSelected.add(id));
    insightBody.querySelectorAll('.insight-check').forEach(c=>{const id=parseInt(c.dataset.checkId);c.classList.toggle('on',insightSelected.has(id))});
    updateInsightActionbar();
    if(fail>0)showToast(`成功 ${ok} 条，${fail} 条失败，请重试`);
    else if(ok>0)showToast(`已为 ${ok} 条笔记添加标签`);
    else if(nochange>0)showToast('所选笔记已有这些标签');
  }catch(e){showToast('添加失败，请检查网络后重试')}
  finally{insightBatchBusy=false;submitBtn.disabled=false;submitBtn.textContent='添加'}
});

/* ============ @ MENTION ============ */
let mentionState={active:false,textarea:null,results:[],selectedIndex:0,start:0};
function checkMention(ta){const cur=ta.selectionStart,text=ta.value.substring(0,cur),m=text.match(/(?:^|\s)@([^\s]*)$/);if(!m){hideMentionDropdown();return}const q=m[1],atIdx=cur-q.length-1;mentionState.textarea=ta;mentionState.start=atIdx;const cands=notes.filter(n=>n.id!==currentDetailId).slice().sort(compareNotes);const filtered=cands.filter(n=>{const t=noteLinkLabel(n).toLowerCase(),p=stripBilinks(n.text).replace(/[#*`>]/g,'').replace(/\n/g,' ').toLowerCase();return t.includes(q.toLowerCase())||p.includes(q.toLowerCase())}).slice(0,8);if(filtered.length===0){hideMentionDropdown();return}mentionState.active=true;mentionState.results=filtered;mentionState.selectedIndex=0;showMentionDropdown(ta,filtered)}
function showMentionDropdown(ta,results){const dd=document.getElementById('mentionDropdown');dd.innerHTML=results.map((n,i)=>{const t=noteLinkLabel(n),p=stripBilinks(n.text).replace(/[#*`>]/g,'').replace(/\n/g,' ').slice(0,40);return `<div class="mention-item ${i===0?'active':''}" data-index="${i}"><div class="mention-item-title"><span class="at">@</span>${escapeHTML(t)}</div><div class="mention-item-preview">${escapeHTML(p)}</div></div>`}).join('');const r=ta.getBoundingClientRect();dd.style.left=(r.left+12)+'px';dd.style.width=Math.min(r.width-24,360)+'px';if(r.top>260){dd.style.bottom=(window.innerHeight-r.top+6)+'px';dd.style.top='auto'}else{dd.style.top=(r.bottom+6)+'px';dd.style.bottom='auto'}dd.classList.add('show')}
function hideMentionDropdown(){document.getElementById('mentionDropdown').classList.remove('show');mentionState.active=false}
function updateMentionSelection(){document.getElementById('mentionDropdown').querySelectorAll('.mention-item').forEach((el,i)=>el.classList.toggle('active',i===mentionState.selectedIndex))}
function selectMention(idx){if(!mentionState.active||idx<0||idx>=mentionState.results.length)return;const note=mentionState.results[idx],token=noteLinkToken(note),ta=mentionState.textarea,before=ta.value.substring(0,mentionState.start),after=ta.value.substring(ta.selectionStart);ta.value=before+'[['+token+']]'+after;const np=before.length+token.length+4;ta.selectionStart=ta.selectionEnd=np;ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}));hideMentionDropdown()}
function setupMention(ta){ta.addEventListener('input',()=>setTimeout(()=>checkMention(ta),0));ta.addEventListener('keydown',e=>{if(!mentionState.active)return;if(e.key==='ArrowDown'){e.preventDefault();mentionState.selectedIndex=Math.min(mentionState.selectedIndex+1,mentionState.results.length-1);updateMentionSelection()}else if(e.key==='ArrowUp'){e.preventDefault();mentionState.selectedIndex=Math.max(mentionState.selectedIndex-1,0);updateMentionSelection()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();selectMention(mentionState.selectedIndex)}else if(e.key==='Escape'){e.preventDefault();hideMentionDropdown()}});ta.addEventListener('blur',()=>setTimeout(hideMentionDropdown,150))}
document.getElementById('mentionDropdown').addEventListener('mousedown',e=>{e.preventDefault();const item=e.target.closest('.mention-item');if(item)selectMention(parseInt(item.dataset.index))});

/* ============ TAG SUGGEST ============ */
let tagSugState={active:false,input:null,results:[],selectedIndex:0,start:0};
function allTags(){const s=new Set();notes.forEach(n=>(n.tags||[]).forEach(t=>s.add(t)));return[...s].sort()}
function checkTagSuggest(inp){const cur=inp.selectionStart,text=inp.value.substring(0,cur),m=text.match(/(?:^|\s)#?([^\s#]*)$/);if(!m){hideTagSuggest();return}const q=m[1].toLowerCase();tagSugState.input=inp;tagSugState.start=cur-m[1].length;const existing=new Set(parseTags(inp.value).map(t=>t.toLowerCase()));const filtered=allTags().filter(t=>{const tl=t.toLowerCase();return tl.includes(q)&&tl!==q&&!existing.has(tl)}).slice(0,8);if(filtered.length===0){hideTagSuggest();return}tagSugState.active=true;tagSugState.results=filtered;tagSugState.selectedIndex=0;showTagSuggestDropdown(inp,filtered)}
function showTagSuggestDropdown(inp,results){const dd=document.getElementById('tagSuggestDropdown');dd.innerHTML=results.map((t,i)=>`<div class="mention-item ${i===0?'active':''}" data-index="${i}"><div class="mention-item-title"><span class="at">#</span>${escapeHTML(t)}</div></div>`).join('');const r=inp.getBoundingClientRect();dd.style.left=r.left+'px';dd.style.width=Math.min(Math.max(r.width,180),320)+'px';if(r.top>260){dd.style.bottom=(window.innerHeight-r.top+6)+'px';dd.style.top='auto'}else{dd.style.top=(r.bottom+6)+'px';dd.style.bottom='auto'}dd.classList.add('show')}
function hideTagSuggest(){document.getElementById('tagSuggestDropdown').classList.remove('show');tagSugState.active=false}
function updateTagSuggestSelection(){document.getElementById('tagSuggestDropdown').querySelectorAll('.mention-item').forEach((el,i)=>el.classList.toggle('active',i===tagSugState.selectedIndex))}
function selectTagSuggest(idx){if(!tagSugState.active||idx<0||idx>=tagSugState.results.length)return;const tag=tagSugState.results[idx],inp=tagSugState.input,before=inp.value.substring(0,tagSugState.start),after=inp.value.substring(inp.selectionStart),needSpace=after.length>0&&!/^\s/.test(after);inp.value=before+tag+(needSpace?' ':'')+after;const np=before.length+tag.length+(needSpace?1:0);inp.selectionStart=inp.selectionEnd=np;inp.focus();inp.dispatchEvent(new Event('input',{bubbles:true}));hideTagSuggest()}
function setupTagSuggest(inp){inp.addEventListener('input',()=>setTimeout(()=>checkTagSuggest(inp),0));inp.addEventListener('keydown',e=>{if(!tagSugState.active)return;if(e.key==='ArrowDown'){e.preventDefault();tagSugState.selectedIndex=Math.min(tagSugState.selectedIndex+1,tagSugState.results.length-1);updateTagSuggestSelection()}else if(e.key==='ArrowUp'){e.preventDefault();tagSugState.selectedIndex=Math.max(tagSugState.selectedIndex-1,0);updateTagSuggestSelection()}else if(e.key==='Tab'){e.preventDefault();selectTagSuggest(tagSugState.selectedIndex)}else if(e.key==='Escape'){e.preventDefault();hideTagSuggest()}});inp.addEventListener('blur',()=>setTimeout(hideTagSuggest,150))}
document.getElementById('tagSuggestDropdown').addEventListener('mousedown',e=>{e.preventDefault();const item=e.target.closest('.mention-item');if(item)selectTagSuggest(parseInt(item.dataset.index))});

const modalMask=document.getElementById('modalMask'),imgFileInput=document.getElementById('imgFileInput'),imgThumbs=document.getElementById('imgThumbs'),noteTextEl=document.getElementById('noteText'),noteRecordedOn=document.getElementById('noteRecordedOn');
let pendingImgs=[];

let activeModalDraftKey=null;
let modalEditSession=0;
function persistNewDraft(){if(!activeModalDraftKey)return;saveDraft(activeModalDraftKey,{text:noteTextEl.value,tags:document.getElementById('noteTags').value,recorded_on:noteRecordedOn.value,imgs:[...pendingImgs]})}
function toggleModalEditorOption(panelId,buttonId){
  const options=document.getElementById('modalEditorOptions'),panel=document.getElementById(panelId),button=document.getElementById(buttonId),opening=panel.hidden;
  options.querySelectorAll('.detail-editor-option').forEach(el=>el.hidden=true);document.querySelectorAll('#modalTagTool,#modalDateTool').forEach(el=>el.classList.remove('active'));

function openModal(prefill,source='new',opts){
  opts=opts||{};
  modalEditSession++;if(source==='quick')touchDraftRevision(quickDraftKey());activeModalSource=source;activeModalDraftKey=modalDraftKey(source);
  const saveBtn=document.getElementById('btnSave');saveBtn.disabled=false;
  const defaultTags=opts.tags!==undefined?opts.tags:(currentTag?currentTag:'');
  const empty={text:'',tags:defaultTags,recorded_on:'',imgs:[]};
  const draft=chooseModalDraft(readDraft(activeModalDraftKey,null),prefill,empty);
  noteTextEl.value=draft.text||'';document.getElementById('noteTags').value=draft.tags||'';noteRecordedOn.value=draft.recorded_on||'';pendingImgs=[...(draft.imgs||[])];persistNewDraft();renderThumbs();modalMask.classList.add('show');
  setTimeout(()=>{noteTextEl.focus();noteTextEl.setSelectionRange(noteTextEl.value.length,noteTextEl.value.length)},200);
}
function closeModal(){modalEditSession++;modalMask.classList.remove('show');const options=document.getElementById('modalEditorOptions');options.hidden=true;options.querySelectorAll('.detail-editor-option').forEach(el=>el.hidden=true);document.querySelectorAll('#modalTagTool,#modalDateTool').forEach(el=>el.classList.remove('active'))}
async function renderThumbs(){const count=document.getElementById('modalAttachmentCount');count.textContent=String(pendingImgs.length);count.classList.toggle('show',pendingImgs.length>0);await renderImageList(imgThumbs,pendingImgs,true)}
async function removeImg(i){const path=pendingImgs[i];if(!await removeStoragePaths([path]))return;pendingImgs.splice(i,1);persistNewDraft();renderThumbs()}
async function uploadImageFiles(files){
  const {data:{user}}=await sb.auth.getUser();if(!user){showToast('请先登录');return[]}
  const paths=[];
  for(const f of files){
    if(!/^image\/(jpeg|png|webp|gif)$/i.test(f.type)){showToast('仅支持 JPG、PNG、WebP 或 GIF');continue}
    if(f.size>10*1024*1024){showToast('图片不能超过 10MB');continue}
    const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';
    const fileName=user.id+'/'+'img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const {error}=await sb.storage.from('note-images').upload(fileName,f,{contentType:f.type});
    if(error){showToast('图片上传失败');continue}paths.push(fileName);
  }
  return paths;
}

modalMask.addEventListener('click',e=>{if(e.target===modalMask)closeModal()});
// mobile: swallow background rubber-band/scroll drift on fullscreen layers
if(window.matchMedia('(max-width:768px)').matches){
  const blockBg=e=>{if(!e.target.closest('.modal,.detail-content,.mention-dropdown'))e.preventDefault()};
  modalMask.addEventListener('touchmove',blockBg,{passive:false});

document.getElementById('btnSave').addEventListener('click',async()=>{
  const text=noteTextEl.value.trim();if(!text&&pendingImgs.length===0)return;
  const session=modalEditSession,draftKey=activeModalDraftKey,source=activeModalSource,draftRevision=getDraftRevision(draftKey),quickKey=quickDraftKey(),quickRevision=source==='quick'?getDraftRevision(quickKey):null,tags=parseTags(document.getElementById('noteTags').value),recorded_on=noteRecordedOn.value||null,imgs=[...pendingImgs];
  const saveBtn=document.getElementById('btnSave');saveBtn.disabled=true;
